name: Build Devuan Root Filesystems (mmdebstrap)

on:
  workflow_dispatch:

jobs:
  build_rootfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armhf, armel]

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install mmdebstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap tar xz-utils qemu-user-static binfmt-support
          sudo update-binfmts --enable

      - name: 3. Build Devuan RootFS with mmdebstrap
        env:
          ROOTFS_DIR: ${{ github.workspace }}/devuan_${{ matrix.arch }}
        run: |
          mkdir -p keyring_tmp
          cd keyring_tmp
          wget -q http://deb.devuan.org/merged/pool/DEVUAN/main/d/devuan-keyring/devuan-keyring_2026.01.13_all.deb
          ar x devuan-keyring_2026.01.13_all.deb
          tar -xf data.tar.xz
          sudo mkdir -p "$ROOTFS_DIR/etc/apt/trusted.gpg.d/"
          sudo cp etc/apt/trusted.gpg.d/* "$ROOTFS_DIR/etc/apt/trusted.gpg.d/"
          cd ..
          sudo mmdebstrap --mode=unshare --architectures=${{ matrix.arch }} --allow-non-empty --variant=minbase --include=locales,tzdata,chrony,dropbear,sudo stable "$ROOTFS_DIR" http://deb.devuan.org/merged
          echo "localhost" | sudo tee "$ROOTFS_DIR/etc/hostname"
          echo "proc /proc proc defaults 0 0" | sudo tee "$ROOTFS_DIR/etc/fstab"
          echo "root:debian123" | sudo chroot "$ROOTFS_DIR" chpasswd
          sudo chroot "$ROOTFS_DIR" bash -c "
            useradd -m -s /bin/bash user
            echo 'user:debian123' | chpasswd
            usermod -aG sudo user
            echo 'user ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/user
            chmod 0440 /etc/sudoers.d/user
          "
          sudo sed -i '/^[[:space:]]*pool/s/^/#/' "$ROOTFS_DIR/etc/chrony/chrony.conf"
          sudo sed -i '/^[[:space:]]*server/s/^/#/' "$ROOTFS_DIR/etc/chrony/chrony.conf"
          echo "server ntp.tencent.com iburst" | sudo tee -a "$ROOTFS_DIR/etc/chrony/chrony.conf"
          sudo rm -rf \
            "$ROOTFS_DIR/var/log/"* \
            "$ROOTFS_DIR/tmp/"* \
            "$ROOTFS_DIR/usr/share/doc/"* \
            "$ROOTFS_DIR/usr/share/man/"* \
            "$ROOTFS_DIR/usr/share/info/"* \
            "$ROOTFS_DIR/var/lib/apt/lists/"*

      - name: 4. Compress RootFS
        id: compress
        env:
          ROOTFS_DIR: ${{ github.workspace }}/devuan_${{ matrix.arch }}
        run: |
          ARCHIVE_NAME=devuan-daedalus-${{ matrix.arch }}.tar.xz
          sudo tar -C "$ROOTFS_DIR" -cJpf "$ARCHIVE_NAME" .
          echo "TARBALL_NAME=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: 5. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devuan-${{ matrix.arch }}
          path: ${{ steps.compress.outputs.TARBALL_NAME }}

  release:
    runs-on: ubuntu-latest
    needs: build_rootfs
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./release

      - name: Flatten artifacts
        run: |
          find ./release -name "*.xz" -exec mv {} ./release/ \;
          find ./release -type d -empty -delete
          ls -lh ./release

      - name: Generate tag
        id: tag
        run: echo "RELEASE_TAG=Devuan_daedalus_$(date +'%Y.%m.%d').${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          name: Devuan ARM RootFS ${{ steps.tag.outputs.RELEASE_TAG }}
          body: |
            自动生成的 Devuan 5 (daedalus) ARM RootFS

            默认账号：
            root / debian123
            user / debian123

            ⚠ 首次登录请修改密码！
          files: ./release/*.xz
