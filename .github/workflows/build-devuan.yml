name: Build Devuan Root Filesystems (mmdebstrap)

on:
  workflow_dispatch:

jobs:
  build_rootfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armhf, armel]

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install mmdebstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap tar xz-utils qemu-user-static binfmt-support
          sudo update-binfmts --enable

      - name: 3. Build Devuan RootFS with mmdebstrap
        env:
          ROOTFS_DIR: ${{ github.workspace }}/devuan_${{ matrix.arch }}
        run: |
          # 1. 准备 Keyring (使用绝对路径)
          mkdir -p "${{ github.workspace }}/keyring_tmp"
          cd "${{ github.workspace }}/keyring_tmp"
          wget -q http://deb.devuan.org/merged/pool/DEVUAN/main/d/devuan-keyring/devuan-keyring_2026.01.13_all.deb
          ar x devuan-keyring_2026.01.13_all.deb data.tar.xz
          tar -xf data.tar.xz
          
          # 定义绝对路径变量
          ABS_KEYRING="$WORK_DIR/keyring_tmp/usr/share/keyrings/devuan-archive-keyring.gpg"
          
          # 检查文件是否存在 (调试用)
          ls -l "$ABS_KEYRING"

          # 2. 构建基础系统
          # 使用 sudo + rootless 模式解决权限和挂载问题
          sudo mmdebstrap \
            --mode=rootless \
            --architectures=${{ matrix.arch }} \
            --variant=minbase \
            --keyring="$ABS_KEYRING" \
            --include=locales,tzdata,chrony,dropbear,sudo \
            stable \
            "$ROOTFS_DIR" \
            "http://deb.devuan.org/merged"

          # 3. 后期配置
          sudo bash -ec "
            echo 'localhost' > '$ROOTFS_DIR/etc/hostname'
            echo 'proc /proc proc defaults 0 0' > '$ROOTFS_DIR/etc/fstab'
            
            # 配置用户
            chroot '$ROOTFS_DIR' /bin/bash -c \"
              echo 'root:debian123' | chpasswd
              useradd -m -s /bin/bash user
              echo 'user:debian123' | chpasswd
              usermod -aG sudo user
              echo 'user ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/user
              chmod 0440 /etc/sudoers.d/user
            \"

            # 配置 Chrony (如果存在)
            if [ -f '$ROOTFS_DIR/etc/chrony/chrony.conf' ]; then
              sed -i '/^[[:space:]]*pool/s/^/#/' '$ROOTFS_DIR/etc/chrony/chrony.conf'
              sed -i '/^[[:space:]]*server/s/^/#/' '$ROOTFS_DIR/etc/chrony/chrony.conf'
              echo 'server ntp.tencent.com iburst' >> '$ROOTFS_DIR/etc/chrony/chrony.conf'
            fi

            # 清理无用文件减小体积
            rm -rf '$ROOTFS_DIR'/var/log/*
            rm -rf '$ROOTFS_DIR'/tmp/*
            rm -rf '$ROOTFS_DIR'/usr/share/doc/*
            rm -rf '$ROOTFS_DIR'/var/lib/apt/lists/*
          "

      - name: 4. Compress RootFS
        id: compress
        env:
          ROOTFS_DIR: ${{ github.workspace }}/devuan_${{ matrix.arch }}
        run: |
          ARCHIVE_NAME=devuan-daedalus-${{ matrix.arch }}.tar.xz
          sudo tar -C "$ROOTFS_DIR" -cJpf "$ARCHIVE_NAME" .
          echo "TARBALL_NAME=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: 5. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devuan-${{ matrix.arch }}
          path: ${{ steps.compress.outputs.TARBALL_NAME }}

  release:
    runs-on: ubuntu-latest
    needs: build_rootfs
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./release

      - name: Flatten artifacts
        run: |
          find ./release -name "*.xz" -exec mv {} ./release/ \;
          find ./release -type d -empty -delete
          ls -lh ./release

      - name: Generate tag
        id: tag
        run: echo "RELEASE_TAG=Devuan_daedalus_$(date +'%Y.%m.%d').${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          name: Devuan ARM RootFS ${{ steps.tag.outputs.RELEASE_TAG }}
          body: |
            自动生成的 Devuan 5 (daedalus) ARM RootFS

            默认账号：
            root / debian123
            user / debian123

            ⚠ 首次登录请修改密码！
          files: ./release/*.xz
